apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: traceops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.1
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: traceops
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
