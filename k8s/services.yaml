apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: traceops
data:
  database.pool.max: "40"
  timeout.ms: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: traceops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
        - name: checkout
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: traceops
spec:
  selector:
    app: checkout-service
  ports:
    - port: 8080
      targetPort: 80
