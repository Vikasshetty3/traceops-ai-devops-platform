apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: traceops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: traceops/backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: "mongodb://mongodb.traceops.svc.cluster.local:27017/requirement_traceable_devops"
            - name: ML_SERVICE_URL
              value: "http://ml-service.traceops.svc.cluster.local:5001"
            - name: DEVOPS_PROVIDER
              value: "kubernetes"
            - name: KUBERNETES_NAMESPACE
              value: "traceops"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: traceops-secrets
                  key: gemini-api-key
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: traceops
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
