name: TraceOps CI & Deployment Readiness Verification

on:
  push:
    branches: [main, phase6-production-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-validate:
    name: Security Audit & Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Root & Backend Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix ml-service

      - name: Verify No Secrets in Version Control
        run: |
          # Check for forbidden secret substrings in tracked source
          ! git grep -i "traceops_production_secret_key" ':!docs/' ':!tests/' ':!scripts/validate_prod_config.js'
          ! git grep -i "admin123" ':!docs/' ':!scripts/'
          ! git grep -i "user123" ':!docs/' ':!scripts/'

      - name: Validate Production Configuration Template
        run: |
          node scripts/validate_prod_config.js
        env:
          NODE_ENV: production
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_dummy_production_secret_string_32_characters' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/ci_test' }}
          CORS_ALLOWED_ORIGINS: 'https://traceops.example.com'
          PORT: '5000'

  build-and-compile:
    name: Build & Typecheck Artifacts
    runs-on: ubuntu-latest
    needs: audit-and-validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend & Frontend Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix ml-service

      - name: Compile Backend TypeScript
        run: npm --prefix backend run build

      - name: Compile Frontend Vite Bundle
        run: npm --prefix frontend run build

      - name: Compile ML Service TypeScript
        run: npm --prefix ml-service run build

  test-and-verify:
    name: Regression & Security Test Matrix
    runs-on: ubuntu-latest
    needs: build-and-compile
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix ml-service

      - name: Build Backend & ML Service
        run: |
          npm --prefix backend run build
          npm --prefix ml-service run build

      - name: Run Phase 6 Production Hardening Tests
        run: node tests/test_phase6_production_hardening.js
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/ci_test_db
          JWT_SECRET: ci_strong_secret_key_32_characters_long_ci

      - name: Run Batch D5 ML Governance E2E Regression
        run: node tests/test_batch_d5_ml_governance_e2e.js
        env:
          MONGO_URI: mongodb://localhost:27017/ci_test_db

  docker-image-build:
    name: Build Immutable Docker Images (Git SHA Tagged)
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: |
            traceops-backend:${{ github.sha }}
            traceops-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: |
            traceops-frontend:${{ github.sha }}
            traceops-frontend:latest

      - name: Build ML Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          file: ml-service/Dockerfile
          push: false
          tags: |
            traceops-ml:${{ github.sha }}
            traceops-ml:latest

  production-deploy-gate:
    name: Production Deployment Gating (Manual Approval Required)
    runs-on: ubuntu-latest
    needs: docker-image-build
    environment:
      name: production
    steps:
      - name: Confirm Explicit Operator Authorization
        run: |
          echo "Production deployment approval verified for Git SHA: ${{ github.sha }}"
          echo "Public deployment is gated pending Phase 7.2 activation."

