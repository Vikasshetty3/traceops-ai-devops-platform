services:

  mongodb:
    image: mongo:7.0
    container_name: traceops-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - traceops-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: traceops-ml-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    networks:
      - traceops-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceops-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/requirement_traceable_devops
      - ML_SERVICE_URL=http://ml-service:5001
      - PROMETHEUS_URL=http://prometheus:9090
      - DEVOPS_PROVIDER=simulation
      - KUBERNETES_NAMESPACE=requirement-traceable-devops
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traceops-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - traceops-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: traceops-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - -disable_metrics=disk,diskIO
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    ports:
      - "8088:8080"
    networks:
      - traceops-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: traceops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - traceops-network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: traceops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      - backend
      - cadvisor
      - node-exporter
    networks:
      - traceops-network

volumes:
  mongo_data:
    driver: local

networks:
  traceops-network:
    driver: bridge