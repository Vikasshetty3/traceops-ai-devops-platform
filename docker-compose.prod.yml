# =================================================================
# TraceOps Production Docker Compose Configuration (docker-compose.prod.yml)
# Hardened for standalone production deployment:
# - Reverse Proxy (Caddy) exposed on ports 80/443 ONLY
# - Zero public host port exposure for MongoDB (27017), Backend (5000),
#   ML service (5001), Prometheus (9090), Grafana (3000), or telemetry exporters
# - Two-tier network segregation: traceops-public & traceops-internal
# - Strict container restart policies (always)
# - Container health checks with deterministic dependency ordering
# - Bounded Docker JSON log rotation preventing host disk exhaustion
# - Persistent volume definitions for database, telemetry, dashboards, and TLS
# =================================================================

services:

  # -----------------------------------------------------------------
  # Edge Reverse Proxy (TLS Termination, Routing & Public Ingress)
  # -----------------------------------------------------------------
  reverse-proxy:
    image: caddy:2.7-alpine
    container_name: traceops-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - traceops-public
      - traceops-internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Static React Single Page Application (Nginx)
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceops-prod-frontend
    restart: always
    expose:
      - "80"
    networks:
      - traceops-internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Core Platform API (Node.js / Express)
  # -----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceops-prod-backend
    restart: always
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/requirement_traceable_devops}
      - ML_SERVICE_URL=http://ml-service:5001
      - PROMETHEUS_URL=http://prometheus:9090
      - DEVOPS_PROVIDER=simulation
      - KUBERNETES_NAMESPACE=requirement-traceable-devops
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,https://${DOMAIN_NAME:-localhost}}
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./ml-service/data:/app/ml-service/data
    networks:
      - traceops-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # -----------------------------------------------------------------
  # Isolated Database (MongoDB 7.0)
  # -----------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: traceops-prod-mongodb
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - traceops-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Machine Learning Microservice
  # -----------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: traceops-prod-ml-service
    restart: always
    expose:
      - "5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
    networks:
      - traceops-internal
    volumes:
      - ./ml-service/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Telemetry Aggregation (Prometheus 2.50.1)
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: traceops-prod-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_prod_data:/prometheus
    depends_on:
      - backend
      - cadvisor
      - node-exporter
    networks:
      - traceops-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Visual Operations Dashboard (Grafana 10.4.1)
  # -----------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: traceops-prod-grafana
    restart: always
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - traceops-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Host & Container Metrics Exporters
  # -----------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: traceops-prod-node-exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - traceops-internal
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "2"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: traceops-prod-cadvisor
    restart: always
    privileged: true
    command:
      - -disable_metrics=disk,diskIO
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
    expose:
      - "8080"
    networks:
      - traceops-internal
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "2"

# -----------------------------------------------------------------
# Storage Volumes
# -----------------------------------------------------------------
volumes:
  mongo_prod_data:
    driver: local
  prometheus_prod_data:
    driver: local
  grafana_prod_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# -----------------------------------------------------------------
# Networks: Tiered Segregation
# -----------------------------------------------------------------
networks:
  traceops-public:
    driver: bridge
  traceops-internal:
    driver: bridge
