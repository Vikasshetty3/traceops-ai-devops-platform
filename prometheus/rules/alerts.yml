groups:
  - name: traceops_slo_alerts
    rules:
      - alert: BackendLatencySLOViolation
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 2.0
        for: 1m
        labels:
          severity: critical
          service: traceops-backend
        annotations:
          summary: "TraceOps backend latency breached 2.0s SLO threshold"
          description: "Current measured p95 latency is {{ $value }}s on TraceOps backend."

      - alert: HostHighCPUUtilization
        expr: (100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)) > 85
        for: 2m
        labels:
          severity: warning
          tier: host
        annotations:
          summary: "Host CPU load elevated"
          description: "Host CPU utilization is at {{ $value }}%."

      - alert: HighErrorRateBreach
        expr: ((sum(rate(http_requests_total{status_class=~"4xx|5xx"}[1m])) or vector(0)) / (sum(rate(http_requests_total[1m])) or vector(1))) * 100 > 5.0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HTTP Error Rate breached threshold"
          description: "Error rate is experiencing {{ $value }}% across active routes."
