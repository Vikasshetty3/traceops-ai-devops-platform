global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "rules/alerts.yml"

scrape_configs:
  - job_name: "traceops-backend"
    metrics_path: "/metrics"
    scrape_interval: 3s
    static_configs:
      - targets: ["backend:5000"]
        labels:
          environment: "production"
          service: "traceops-backend"

  - job_name: "node-exporter"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "production"
          tier: "host"

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "production"
          tier: "containers"
